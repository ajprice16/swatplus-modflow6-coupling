[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "swatplus-modflow6-coupling"
version = "0.1.0"
description = "A Python framework for coupling the SWAT+ watershed model with the MODFLOW 6 groundwater model"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Hydrologic Coupling Team", email = "ajprice16@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "flopy>=3.5",
]

[project.optional-dependencies]
# libmf6 (XMI) access for the daily engine: `swatplus-modflow run`
bmi = ["xmipy>=1.3", "modflowapi>=1.0"]
# GIS inputs: `swatplus-modflow build-modflow` and `build-connections`
gis = ["geopandas>=0.12", "rasterio>=1.3", "shapely>=2.0", "pyproj>=3.4"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.910",
    "xmipy>=1.3",
    "modflowapi>=1.0",
    "geopandas>=0.12",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.4",
]

[project.scripts]
swatplus-modflow = "swatplus_modflow.cli:main"

[project.urls]
Homepage = "https://github.com/ajprice16/swatplus-modflow6-coupling"

[tool.setuptools.packages.find]
include = ["swatplus_modflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
