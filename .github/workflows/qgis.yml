name: qgis

# The plugin's headless tests and GUI screenshots on several QGIS versions (Qt5 and Qt6) on Linux and
# Windows. The 'gui-comparison' artifact holds index.html with every captured version side by side.
on:
  push:
    paths: ["qgis_plugin/**", ".github/workflows/qgis.yml"]
  pull_request:
    paths: ["qgis_plugin/**", ".github/workflows/qgis.yml"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly, to catch new QGIS point releases

jobs:
  linux:
    name: QGIS ${{ matrix.label }} (Linux)
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "3.40 Qt5", slug: linux-3.40, image: "qgis/qgis:3.40-noble" }
          - { label: "3.44 LTR Qt5", slug: linux-3.44, image: "qgis/qgis:3.44-noble" }
          - { label: "4.2 Qt6", slug: linux-4.2, image: "qgis/qgis:4.2-trixie" }
    steps:
      - uses: actions/checkout@v4
      - name: Headless tests
        run: bash qgis_plugin/tests/run_qgis_tests.sh
      - name: GUI screenshots
        if: always()
        run: bash qgis_plugin/tests/run_qgis_tests.sh capture shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-${{ matrix.slug }}
          path: shots
          if-no-files-found: warn

  windows:
    name: QGIS ${{ matrix.label }} (Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "LTR", slug: windows-ltr, choco: qgis-ltr }
          - { label: "latest", slug: windows-latest, choco: qgis }
    steps:
      - uses: actions/checkout@v4
      - name: Install QGIS
        id: install
        shell: pwsh
        run: |
          # the Chocolatey download from qgis.org fails now and then; try three times
          for ($i = 1; $i -le 3; $i++) {
            choco install ${{ matrix.choco }} -y --no-progress
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Output "attempt $i failed (exit $LASTEXITCODE); retrying in 30 s"
            Start-Sleep -Seconds 30
          }
          exit 1
      - name: Locate QGIS
        shell: pwsh
        run: |
          $root = Get-ChildItem "C:\Program Files" -Directory -Filter "QGIS*" | Sort-Object Name | Select-Object -Last 1
          if (-not $root) { throw "QGIS install folder not found" }
          Write-Output "QGIS_ROOT=$($root.FullName)" >> $env:GITHUB_ENV
          Get-ChildItem "$($root.FullName)\bin" -Filter "python-qgis*.bat" | ForEach-Object { $_.Name }
      - name: Headless tests
        shell: cmd
        run: call qgis_plugin\tests\run_qgis_tests.bat "%QGIS_ROOT%"
      - name: GUI screenshots
        if: always() && steps.install.outcome == 'success'
        shell: cmd
        run: call qgis_plugin\tests\run_qgis_tests.bat "%QGIS_ROOT%" capture "%GITHUB_WORKSPACE%\shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-${{ matrix.slug }}
          path: shots
          if-no-files-found: warn

  osgeo4w:
    # One OSGeo4W root with two QGIS builds (LTR and latest): the runner must test and capture both.
    name: QGIS LTR + latest (Windows, OSGeo4W)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OSGeo4W with qgis-ltr and qgis
        id: install
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.osgeo.org/osgeo4w/v2/osgeo4w-setup.exe -OutFile osgeo4w-setup.exe
          for ($i = 1; $i -le 3; $i++) {
            $p = Start-Process -FilePath .\osgeo4w-setup.exe -Wait -PassThru -ArgumentList @(
              "--advanced", "--autoaccept", "--quiet-mode", "--no-desktop", "--no-startmenu",
              "--root", "C:\OSGeo4W", "--site", "https://download.osgeo.org/osgeo4w/v2",
              "--local-package-dir", "C:\OSGeo4W-cache", "--packages", "qgis-ltr,qgis")
            if ((Test-Path C:\OSGeo4W\bin\python-qgis-ltr.bat) -and (Test-Path C:\OSGeo4W\bin\python-qgis.bat)) { break }
            Write-Output "attempt ${i}: setup exit $($p.ExitCode), launchers missing; retrying"
            Start-Sleep -Seconds 30
          }
          Get-ChildItem C:\OSGeo4W\bin -Filter "python-qgis*.bat" | ForEach-Object { $_.Name }
          if (-not (Test-Path C:\OSGeo4W\bin\python-qgis-ltr.bat) -or -not (Test-Path C:\OSGeo4W\bin\python-qgis.bat)) { exit 1 }
      - name: Headless tests (every build)
        shell: cmd
        run: |
          call qgis_plugin\tests\run_qgis_tests.bat C:\OSGeo4W > tests.log 2>&1
          set RC=%ERRORLEVEL%
          type tests.log
          findstr /c:"Ran 2 QGIS build(s)" tests.log || exit /b 1
          exit /b %RC%
      - name: One build only (--variant ltr)
        shell: cmd
        run: |
          call qgis_plugin\tests\run_qgis_tests.bat C:\OSGeo4W --variant ltr > one.log 2>&1
          set RC=%ERRORLEVEL%
          type one.log
          findstr /c:"Ran 1 QGIS build(s): ltr" one.log || exit /b 1
          exit /b %RC%
      - name: GUI screenshots (every build)
        if: always() && steps.install.outcome == 'success'
        shell: cmd
        run: call qgis_plugin\tests\run_qgis_tests.bat C:\OSGeo4W capture shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-windows-osgeo4w
          path: shots
          if-no-files-found: warn

  comparison:
    name: GUI comparison page
    needs: [linux, windows, osgeo4w]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gui-*
          path: shots
          merge-multiple: true
      - name: Build index.html
        run: python3 qgis_plugin/tests/qgis/capture_gui.py --sheet shots
      - uses: actions/upload-artifact@v4
        with:
          name: gui-comparison
          path: shots
