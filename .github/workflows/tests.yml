name: tests

on:
  push:
  pull_request:

jobs:
  # Everything that needs no MODFLOW binary. The end-to-end tests skip themselves here.
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test (no MODFLOW binaries)
        run: python -m pytest -q -rs

  # The daily engine through real libmf6: fetch mf6/libmf6 with flopy's get-modflow, then run the
  # end-to-end and pipeline tests. SWATPLUS_REQUIRE_LIBMF6 turns a missing library into a failure
  # instead of a skip, so this job cannot pass without actually running the engine.
  e2e:
    name: end-to-end libmf6 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      SWATPLUS_REQUIRE_LIBMF6: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Fetch mf6 and libmf6
        shell: bash
        env:
          # get-modflow queries the GitHub API; anonymous calls from shared runners hit the rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/mf6bin"
          python -m flopy.utils.get_modflow "$RUNNER_TEMP/mf6bin" --repo modflow6
          ls -lR "$RUNNER_TEMP/mf6bin"
          lib=$(find "$RUNNER_TEMP/mf6bin" -name 'libmf6.*' | head -n 1)
          if [ -z "$lib" ]; then echo "libmf6 not found after get-modflow" >&2; exit 1; fi
          echo "SWATPLUS_TEST_LIBMF6=$lib" >> "$GITHUB_ENV"
      - name: End-to-end tests
        run: python -m pytest -q -rs tests/test_engine_e2e.py tests/test_pipeline_and_contract.py
